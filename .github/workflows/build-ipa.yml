name: Build StorefrontSwitcher IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project StorefrontSwitcher.xcodeproj \
            -scheme StorefrontSwitcher \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/StorefrontSwitcher.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload StorefrontSwitcher.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StorefrontSwitcher-IPA
          path: build/StorefrontSwitcher.ipa
          if-no-files-found: error
          retention-days: 14
