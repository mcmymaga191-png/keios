name: Build unsigned iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Locate Xcode project
        id: project
        run: |
          PROJECT_PATH=$(find . -type d -name 'StorefrontSwitcher.xcodeproj' -print -quit)
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: StorefrontSwitcher.xcodeproj was not found in the repository."
            echo "Make sure you uploaded/extracted the project files, not just the workflow file."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Xcode project: $PROJECT_PATH"
          xcodebuild -list -project "$PROJECT_PATH"

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project "${{ steps.project.outputs.project_path }}" \
            -scheme StorefrontSwitcher \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/StorefrontSwitcher.app"
          test -d "$APP_PATH" || { echo "App bundle not found: $APP_PATH"; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry StorefrontSwitcher.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StorefrontSwitcher-unsigned-IPA
          path: ${{ runner.temp }}/StorefrontSwitcher.ipa
          if-no-files-found: error
