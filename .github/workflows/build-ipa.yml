name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          PROJECT_PATH="$(find . -type d -name 'StorefrontSwitcher.xcodeproj' -print -quit)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "Не найден StorefrontSwitcher.xcodeproj"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_PATH")"
          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Найден проект: $PROJECT_PATH"

      - name: Detect scheme
        id: scheme
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_path }}"
          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')"
          if [ -z "$SCHEME" ]; then
            echo "Не удалось определить Xcode scheme"
            exit 1
          fi
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Используется scheme: $SCHEME"

      - name: Build app (unsigned)
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_path }}"
          SCHEME="${{ steps.scheme.outputs.scheme }}"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        shell: bash
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Собранное .app приложение не найдено"
            exit 1
          fi

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r "$GITHUB_WORKSPACE/StorefrontSwitcher-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StorefrontSwitcher-unsigned-IPA
          path: StorefrontSwitcher-unsigned.ipa
          if-no-files-found: error
