name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show selected SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install ldid
        run: brew install ldid

      - name: Find Xcode project and scheme
        id: project
        shell: bash
        run: |
          PROJECT_PATH="$(find . -type d -name 'StorefrontSwitcher.xcodeproj' -print -quit)"
          test -n "$PROJECT_PATH" || { echo "Project not found"; exit 1; }
          SCHEME="$(xcodebuild -list -json -project "$PROJECT_PATH" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')"
          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build app
        shell: bash
        run: |
          xcodebuild \
            -project "${{ steps.project.outputs.project_path }}" \
            -scheme "${{ steps.project.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Apply TrollStore entitlement and package
        shell: bash
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH" || { echo "Built .app not found"; exit 1; }
          APP_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          test -f "$APP_PATH/$APP_EXECUTABLE" || { echo "Executable not found"; exit 1; }

          ldid -SStorefrontSwitcher/TrollStore.entitlements "$APP_PATH/$APP_EXECUTABLE"
          ldid -e "$APP_PATH/$APP_EXECUTABLE" > build/entitlements-applied.plist
          plutil -lint build/entitlements-applied.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.private.security.no-sandbox' build/entitlements-applied.plist

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r "$GITHUB_WORKSPACE/StorefrontSwitcher-TrollStore.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StorefrontSwitcher-TrollStore-IPA
          path: StorefrontSwitcher-TrollStore.ipa
          if-no-files-found: error
